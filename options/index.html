// --- Black-Scholes -----------------------------------------------------------
function normCDF(x) {
  const a = [0.254829592, -0.284496736, 1.421413741, -1.453152027, 1.061405429];
  const p = 0.3275911,
    s = x < 0 ? -1 : 1;
  x = Math.abs(x) / Math.SQRT2;
  const t = 1 / (1 + p * x);
  let y = t * (a[0] + t * (a[1] + t * (a[2] + t * (a[3] + t * a[4]))));
  y = 1 - y * Math.exp(-x * x);
  return 0.5 * (1 + s * y);
}
function bsPut(S, K, T, sigma, r = 0.05) {
  if (T <= 0) return {
    price: Math.max(K - S, 0),
    delta: K > S ? -1 : 0,
    probOTM: K > S ? 0 : 1
  };
  const d1 = (Math.log(S / K) + (r + 0.5 * sigma * sigma) * T) / (sigma * Math.sqrt(T));
  const d2 = d1 - sigma * Math.sqrt(T);
  const price = K * Math.exp(-r * T) * normCDF(-d2) - S * normCDF(-d1);
  return {
    price: Math.max(price, 0),
    delta: normCDF(-d1) - 1,
    probOTM: normCDF(d2)
  };
}

// --- Persistence ------------------------------------------------------------
// usePersistentState mirrors React state into localStorage so edits made
// inside the tracker UI survive a refresh / restart. Initial value: if a
// previously-saved blob exists at `key`, use that; otherwise use the seed
// from the JS sidecar (options-trades.js / options-capital.js).
//

const LS_PREFIX = 'optionsTracker_';
function usePersistentState(key, seed) {
  const fullKey = LS_PREFIX + key;

    try {
      const raw = localStorage.getItem(fullKey);
      if (raw) {
        const parsed = JSON.parse(raw);
        // Sanity-check: object/array of the right shape; otherwise fall back to seed
        if (parsed !== null && typeof parsed === typeof seed) return parsed;
      }
    } catch (e) { /* corrupt or unavailable — fall through to seed */ }
    return seed;
  });

    try {

      localStorage.setItem(LS_PREFIX + 'lastModified', new Date().toISOString());
    } catch (e) { /* private mode / quota — ignore */ }
  }, [fullKey, value]);
  return [value, setValue];
}

// --- Data widget: Export / Import / Reset --------------------------------
// A floating button group in the bottom-right that operates directly on
// localStorage (the persistence layer the tracker now writes to). Use this
// to move state between Mac and iPhone:
//
//   Mac → iPhone:  click Export on Mac → AirDrop the .json → click Import on phone
//   iPhone → Mac:  same, opposite direction
//   Either device: click Reset to wipe and re-seed from options-trades.js
(function setupDataWidget() {
  const KEYS = ['optionsTracker_trades', 'optionsTracker_capital', 'optionsTracker_fx', 'optionsTracker_lastModified'];

  function readAll() {
    const out = {};
    KEYS.forEach(k => {
      const v = localStorage.getItem(k);
      if (v !== null) {
        try { out[k] = JSON.parse(v); } catch (_) { out[k] = v; }
      }
    });
    return out;
  }
  function writeAll(blob) {
    KEYS.forEach(k => {
      if (blob[k] !== undefined) {
        const v = typeof blob[k] === 'string' ? blob[k] : JSON.stringify(blob[k]);
        localStorage.setItem(k, v);
      }
    });
  }

  function exportData() {
    const payload = {
      schema: 'options-tracker-v1',
      exportedAt: new Date().toISOString(),
      device: /iPhone|iPad|iPod/.test(navigator.userAgent) ? 'iOS' :
              /Mac/.test(navigator.userAgent) ? 'Mac' :
              /Android/.test(navigator.userAgent) ? 'Android' : 'Other',
      data: readAll()
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'options-tracker-' + ts + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
  }

  function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.onchange = async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        if (parsed.schema !== 'options-tracker-v1' || !parsed.data) {
          alert('That file doesn\'t look like an Options Tracker backup (missing schema or data).');
          return;
        }
        const summary = [];
        const t = parsed.data['optionsTracker_trades'];
        if (Array.isArray(t)) summary.push(t.length + ' trades');
        if (parsed.data['optionsTracker_capital']) summary.push('capital data');
        if (parsed.data['optionsTracker_fx'] !== undefined) summary.push('FX rate');
        const ok = confirm(
          'Import will REPLACE the current state in THIS browser with:\n' +
          '  • ' + summary.join('\n  • ') + '\n\n' +
          'Exported from ' + (parsed.device || 'unknown') + ' at ' + parsed.exportedAt + '\n\n' +
          'Tip: Export first if you want a rollback file. Proceed?'
        );
        if (!ok) return;
        writeAll(parsed.data);
        location.reload();
      } catch (err) {
        alert('Import failed: ' + err.message);
      }
    };
    input.click();
  }

  function resetToBundled() {
    const ok = confirm(
      'Reset to the bundled seed data?\n\n' +
      'This clears all edits made in THIS browser and re-loads trades from ' +
      'options-trades.js and capital from options-capital.js.\n\n' +
      'Tip: Export first if you want a rollback file. This cannot be undone.'
    );
    if (!ok) return;
    KEYS.forEach(k => localStorage.removeItem(k));
    location.reload();
  }

  function btn(label, title, onClick) {
    const b = document.createElement('button');
    b.textContent = label;
    b.title = title;
    b.style.cssText =
      'background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:5px;' +
      'padding:6px 10px;cursor:pointer;font-size:12px;font-family:inherit;line-height:1;';
    b.onmouseover = function () { b.style.borderColor = '#3b82f6'; };
    b.onmouseout  = function () { b.style.borderColor = '#334155'; };
    b.onclick = onClick;
    return b;
  }

  const wrap = document.createElement('div');
  wrap.id = 'options-data-widget';
  wrap.style.cssText =
    'position:fixed;bottom:14px;right:14px;display:flex;gap:6px;' +
    'background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:6px;' +
    'z-index:9999;font-family:-apple-system,BlinkMacSystemFont,sans-serif;' +
    'box-shadow:0 6px 18px rgba(0,0,0,0.45)';
  wrap.appendChild(btn('⬇ Export', 'Download a JSON backup of trades + capital + FX', exportData));
  wrap.appendChild(btn('⬆ Import', 'Restore from a JSON backup (replaces current state)', importData));
  wrap.appendChild(btn('↺ Reset',  'Clear edits and re-seed from the bundled JS files',  resetToBundled));
  document.body.appendChild(wrap);
})();
